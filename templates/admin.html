<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Figtree -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <img src="/static/images/logo-image.png">
      <h1>Daily News Briefing Text to Audio Upload</h1>
      <p>Upload PDF → Generate MP3 → Updates list</p>
    </div>
  </header>

  <main>
    <div class="layout">
      <div class="card">
        <h2>Upload & Generate</h2>

        <form id="uploadForm" method="POST" enctype="multipart/form-data">
          <div class="field">
            <label>Title (optional)</label>
            <input name="title" type="text" />
          </div>

          <div class="field">
            <label>Audio Date</label>
            <input name="mp3_date" type="date" required />
          </div>

          <div class="field">
            <label>PDF file</label>
            <input name="pdf" type="file" accept="application/pdf" required />
          </div>

          <button class="btn" id="submitBtn" type="submit">Upload & Generate</button>

          <div class="progressWrap" id="progressWrap">
            <div class="progressLabel">
              <span id="progressText">Generating audio…</span>
              <span id="progressPct">0%</span>
            </div>
            <div class="barOuter">
              <div class="barInner" id="barInner"></div>
            </div>
          </div>

          <div class="error" id="errorBox"></div>

          <p class="note">
            Access token is required: <code>/admin?token=YOUR_ADMIN_TOKEN</code>
          </p>
        </form>
      </div>

      <div class="card">
        <h2>Available Audio Files</h2>
        <div class="list" id="audioList"></div>
      </div>
    </div>
  </main>

  <script>
    // Keep token in the URL so fetch hits the same protected endpoint
    const token = new URLSearchParams(window.location.search).get("token") || "";

    const form = document.getElementById("uploadForm");
    const submitBtn = document.getElementById("submitBtn");
    const progressWrap = document.getElementById("progressWrap");
    const barInner = document.getElementById("barInner");
    const progressPct = document.getElementById("progressPct");
    const progressText = document.getElementById("progressText");
    const errorBox = document.getElementById("errorBox");
    const audioList = document.getElementById("audioList");

    function esc(s){
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[c]));
    }

    function mp3Url(filename){
      return `/mp3/${encodeURIComponent(filename)}`;
    }

    async function loadTracks(){
      const url = token
        ? `/admin/tracks?token=${encodeURIComponent(token)}`
        : "/admin/tracks";

      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to load tracks");

      const tracks = await res.json();

      audioList.innerHTML = tracks.length ? "" : `<div class="note">No audio files yet.</div>`;

      tracks.forEach((t, i) => {
        const title = t.title || t.filename;
        const filename = t.filename;
        const id = t.id;

        const div = document.createElement("div");
        div.className = "item";
        div.dataset.id = id;

        div.innerHTML = `
          <div style="display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap;">
            <div style="flex:1; min-width:220px;">
              <label style="font-weight:800; color:var(--navy); font-size:13px;">Title</label>
              <input data-role="title" type="text" value="${esc(title)}" />
              <div class="note"><code>${esc(filename)}</code> • <code>${esc(id)}</code></div>
            </div>

            <div style="display:flex; gap:8px; align-items:center;">
              <button class="btnSmall" data-action="up" ${i===0 ? "disabled" : ""}>▲</button>
              <button class="btnSmall" data-action="down" ${i===tracks.length-1 ? "disabled" : ""}>▼</button>
              <button class="btnSmall" data-action="save">Save</button>
              <button class="btnSmall danger" data-action="delete">Delete</button>
            </div>
          </div>

          <audio controls preload="metadata" style="margin-top:10px;">
            <source src="${mp3Url(filename)}" type="audio/mpeg">
          </audio>
        `;

        audioList.appendChild(div);
      });
    }


    // Progress animation: fills to 90% while waiting, then completes
    let progTimer = null;
    function startProgress(){
      progressWrap.style.display = "block";
      errorBox.style.display = "none";
      submitBtn.disabled = true;

      let p = 0;
      progressText.textContent = "Generating audio…";
      progressPct.textContent = "0%";
      barInner.style.width = "0%";

      clearInterval(progTimer);
      progTimer = setInterval(() => {
        // Ease towards 90%
        p = Math.min(90, p + Math.max(1, (90 - p) * 0.06));
        const pct = Math.floor(p);
        barInner.style.width = pct + "%";
        progressPct.textContent = pct + "%";
      }, 180);
    }

    function finishProgress(success=true){
      clearInterval(progTimer);
      barInner.style.width = "100%";
      progressPct.textContent = "100%";
      progressText.textContent = success ? "Done!" : "Stopped";
      setTimeout(() => {
        progressWrap.style.display = "none";
        submitBtn.disabled = false;
      }, 600);
    }

    function showError(msg){
      errorBox.textContent = msg;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      progressWrap.style.display = "none";
      clearInterval(progTimer);
    }

    const SUGGESTED_MAX = 14000;

    form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fd = new FormData(form);

    try {
      // 1) Ask server for character count
      const countUrl = token
        ? `/admin/charcount?token=${encodeURIComponent(token)}`
        : "/admin/charcount";

      const countRes = await fetch(countUrl, {
        method: "POST",
        body: fd,
        headers: { "X-Requested-With": "fetch" }
      });

      if (!countRes.ok) {
        const txt = await countRes.text();
        throw new Error(txt || "Character count failed");
      }

      const countData = await countRes.json();
      const charCount = countData.char_count || 0;

      // 2) Confirm if over threshold
      if (charCount > SUGGESTED_MAX) {
        const ok = confirm(
          `This document contains ${charCount.toLocaleString()} characters.\n\n` +
          `Are you sure you want to exceed the suggested maximum of ${SUGGESTED_MAX.toLocaleString()} characters?`
        );
        if (!ok) return;
      }

      // 3) Proceed with actual generation
      startProgress();

      const postUrl = token
        ? `/admin?token=${encodeURIComponent(token)}`
        : "/admin";

      const res = await fetch(postUrl, {
        method: "POST",
        body: new FormData(form), // recreate FormData
        headers: { "X-Requested-With": "fetch" }
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(txt || ("Upload failed: " + res.status));
      }

      finishProgress(true);
      await loadTracks();
      form.querySelector('input[type="file"]').value = "";

    } catch (err) {
      showError(err.message || String(err));
    }
  });


    // Initial list load
    loadTracks();

    async function apiFetch(path, options = {}) {
      const url = token ? `${path}?token=${encodeURIComponent(token)}` : path;
      const res = await fetch(url, options);
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(txt || `${res.status} ${res.statusText}`);
      }
      return res;
    }

    function getCurrentOrder(){
      return Array.from(document.querySelectorAll("#audioList .item"))
        .map(el => el.dataset.id);
    }

    function moveItem(id, dir){
      const items = Array.from(document.querySelectorAll("#audioList .item"));
      const idx = items.findIndex(x => x.dataset.id === id);
      if (idx < 0) return;

      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= items.length) return;

      const parent = items[idx].parentElement;
      if (dir === -1) parent.insertBefore(items[idx], items[newIdx]);
      else parent.insertBefore(items[newIdx], items[idx]);
    }

    async function persistOrder(){
      const order = getCurrentOrder();
      await apiFetch("/admin/reorder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ order })
      });
    }

    audioList.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;

      const item = e.target.closest(".item");
      const id = item?.dataset.id;
      if (!id) return;

      const action = btn.dataset.action;

      try {
        if (action === "save") {
          const titleInput = item.querySelector('input[data-role="title"]');
          const newTitle = (titleInput.value || "").trim();

          await apiFetch(`/admin/track/${encodeURIComponent(id)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: newTitle })
          });

          await loadTracks();
        }

        if (action === "delete") {
          const ok = confirm("Delete this track? This will remove it from the list and delete the MP3 file.");
          if (!ok) return;

          await apiFetch(`/admin/track/${encodeURIComponent(id)}`, { method: "DELETE" });
          await loadTracks();
        }

        if (action === "up") {
          moveItem(id, -1);
          await persistOrder();
          await loadTracks();
        }

        if (action === "down") {
          moveItem(id, +1);
          await persistOrder();
          await loadTracks();
        }
      } catch (err) {
        showError(err.message || String(err));
      }
    });

    // --- Single-active audio on admin list (resume position in-memory) ---
    const audioPositions = new Map(); // key -> seconds
    let currentAudio = null;

    function audioKey(audioEl) {
      // Prefer filename from <source src="/mp3/..."> as the key
      const srcEl = audioEl.querySelector("source");
      const src = srcEl ? srcEl.getAttribute("src") : audioEl.currentSrc;
      return src || audioEl.id || String(Math.random());
    }

    function rememberPosition(audioEl) {
      try {
        audioPositions.set(audioKey(audioEl), audioEl.currentTime || 0);
      } catch {}
    }

    function restorePosition(audioEl) {
      const key = audioKey(audioEl);
      const t = audioPositions.get(key);
      if (typeof t === "number" && isFinite(t) && t > 0) {
        try { audioEl.currentTime = t; } catch {}
      }
    }

    // When any audio starts playing, pause the previous one and remember its position.
    // Use capture so it fires even if play() is triggered via controls.
    audioList.addEventListener("play", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLAudioElement)) return;

      // Pause other audio if needed
      if (currentAudio && currentAudio !== target) {
        rememberPosition(currentAudio);
        try { currentAudio.pause(); } catch {}
      }

      // Restore target position (if we have one)
      restorePosition(target);

      currentAudio = target;
    }, true);

    // When audio is paused/ended, remember its position
    audioList.addEventListener("pause", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLAudioElement)) return;
      rememberPosition(target);
    }, true);

    audioList.addEventListener("ended", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLAudioElement)) return;
      rememberPosition(target);
      if (currentAudio === target) currentAudio = null;
    }, true);

    // Optional: when the user seeks, update stored time so resuming is accurate
    audioList.addEventListener("seeking", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLAudioElement)) return;
      rememberPosition(target);
    }, true);


  </script>
</body>
</html>
