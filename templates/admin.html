<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Figtree -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#162E51;
      --blue:#2378C3;
      --blue-dark:#1A4480;
      --gold:#FFBE2E;
      --bg:#F5F7FA;
      --text:#0B1F33;
      --muted:#4A5568;
      --border: rgba(10, 25, 41, 0.12);
      --card:#fff;
      --shadow: 0 10px 28px rgba(10, 25, 41, 0.14);
      --radius:16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Figtree",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(35,120,195,0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(255,190,46,0.18), transparent 50%),
        var(--bg);
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      background:var(--navy);
      color:#fff;
      padding:14px 0;
      border-bottom:4px solid var(--gold);
    }
    .topbar .container{
      max-width: 980px; margin:0 auto; padding:0 18px;
    }
    .topbar h1{ margin:0; font-size:20px; font-weight:700; }
    .topbar p{ margin:4px 0 0; font-size:13px; color:rgba(255,255,255,0.85); }

    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px 18px 34px;
    }

    .layout{
      width: min(980px, 100%);
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:16px;
      align-items:start;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
    }

    .card h2{
      margin:0 0 10px 0;
      font-size:18px;
      font-weight:800;
      color:var(--navy);
    }

    label{ font-weight:700; color:var(--navy); }
    .field{ margin:12px 0; }
    input[type="text"], input[type="number"], input[type="file"]{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid rgba(22,46,81,0.18);
      outline:none;
      font-family:inherit;
      font-size:14px;
      background:#fff;
    }
    input:focus{
      border-color: rgba(35,120,195,0.55);
      box-shadow: 0 0 0 4px rgba(35,120,195,0.12);
    }

    .btn{
      width:100%;
      border:1px solid rgba(26, 68, 128, 0.25);
      background:var(--blue);
      color:#fff;
      padding:12px 14px;
      border-radius:12px;
      font-weight:800;
      cursor:pointer;
      transition: transform 120ms ease, background 120ms ease;
    }
    .btn:hover{ background:var(--blue-dark); }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ opacity:0.6; cursor:not-allowed; }

    /* Progress bar */
    .progressWrap{
      margin-top: 12px;
      display:none;
    }
    .progressLabel{
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      display:flex;
      justify-content:space-between;
      gap:12px;
    }
    .barOuter{
      height: 10px;
      border-radius: 999px;
      background: rgba(22,46,81,0.10);
      overflow: hidden;
      border: 1px solid rgba(22,46,81,0.12);
    }
    .barInner{
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), #3aa0ff);
      transition: width 180ms ease;
    }

    /* List */
    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top: 6px;
      max-height: 520px;
      overflow:auto;
      padding-right: 6px;
    }
    .item{
      background:#fff;
      border:1px solid rgba(22,46,81,0.12);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(10, 25, 41, 0.08);
      padding:12px;
    }
    .itemTitle{
      font-weight:800;
      margin:0 0 8px 0;
      color:var(--navy);
      font-size:14px;
    }
    audio{ width:100%; }
    .error{
      color:#8b0000;
      background: rgba(255,0,0,0.06);
      border:1px solid rgba(255,0,0,0.18);
      padding:10px 12px;
      border-radius: 12px;
      margin-top: 12px;
      display:none;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .note{
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height:1.4;
    }
    code{
      background: rgba(22,46,81,0.06);
      padding: 2px 6px;
      border-radius: 8px;
    }

    /* Mobile: stack cards, keep centered */
    @media (max-width: 860px){
      main{ align-items:flex-start; }
      .layout{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Admin Upload</h1>
      <p>Upload PDF → Generate MP3 → Updates list</p>
    </div>
  </header>

  <main>
    <div class="layout">
      <div class="card">
        <h2>Upload & Generate</h2>

        <form id="uploadForm" method="POST" enctype="multipart/form-data">
          <div class="field">
            <label>Title (optional)</label>
            <input name="title" type="text" />
          </div>

          <div class="field">
            <label>MP3 filename (no .mp3)</label>
            <input name="mp3_name" type="text" required />
          </div>

          <div class="field">
            <label>Max characters to convert (optional)</label>
            <input name="max_chars" type="number" min="500" step="500" value="4000" />
          </div>

          <div class="field">
            <label>PDF file</label>
            <input name="pdf" type="file" accept="application/pdf" required />
          </div>

          <button class="btn" id="submitBtn" type="submit">Upload & Generate</button>

          <div class="progressWrap" id="progressWrap">
            <div class="progressLabel">
              <span id="progressText">Generating audio…</span>
              <span id="progressPct">0%</span>
            </div>
            <div class="barOuter">
              <div class="barInner" id="barInner"></div>
            </div>
          </div>

          <div class="error" id="errorBox"></div>

          <p class="note">
            Access token is required: <code>/admin?token=YOUR_ADMIN_TOKEN</code>
          </p>
        </form>
      </div>

      <div class="card">
        <h2>Available Audio Files</h2>
        <div class="list" id="audioList"></div>
      </div>
    </div>
  </main>

  <script>
    // Keep token in the URL so fetch hits the same protected endpoint
    const token = new URLSearchParams(window.location.search).get("token") || "";

    const form = document.getElementById("uploadForm");
    const submitBtn = document.getElementById("submitBtn");
    const progressWrap = document.getElementById("progressWrap");
    const barInner = document.getElementById("barInner");
    const progressPct = document.getElementById("progressPct");
    const progressText = document.getElementById("progressText");
    const errorBox = document.getElementById("errorBox");
    const audioList = document.getElementById("audioList");

    function esc(s){
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[c]));
    }

    function mp3Url(filename){
      return `/mp3/${encodeURIComponent(filename)}`;
    }

    async function loadTracks(){
      const res = await fetch("/tracks.json", { cache: "no-store" });
      const data = await res.json();
      const tracks = (data.tracks || []);

      audioList.innerHTML = tracks.length ? "" : `<div class="note">No audio files yet.</div>`;

      tracks.forEach(t => {
        const title = t.title || t.filename;
        const filename = t.filename;

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <p class="itemTitle">${esc(title)}</p>
          <audio controls preload="metadata">
            <source src="${mp3Url(filename)}" type="audio/mpeg">
          </audio>
          <div class="note"><code>${esc(filename)}</code></div>
        `;
        audioList.appendChild(div);
      });
    }

    // Progress animation: fills to 90% while waiting, then completes
    let progTimer = null;
    function startProgress(){
      progressWrap.style.display = "block";
      errorBox.style.display = "none";
      submitBtn.disabled = true;

      let p = 0;
      progressText.textContent = "Generating audio…";
      progressPct.textContent = "0%";
      barInner.style.width = "0%";

      clearInterval(progTimer);
      progTimer = setInterval(() => {
        // Ease towards 90%
        p = Math.min(90, p + Math.max(1, (90 - p) * 0.06));
        const pct = Math.floor(p);
        barInner.style.width = pct + "%";
        progressPct.textContent = pct + "%";
      }, 180);
    }

    function finishProgress(success=true){
      clearInterval(progTimer);
      barInner.style.width = "100%";
      progressPct.textContent = "100%";
      progressText.textContent = success ? "Done!" : "Stopped";
      setTimeout(() => {
        progressWrap.style.display = "none";
        submitBtn.disabled = false;
      }, 600);
    }

    function showError(msg){
      errorBox.textContent = msg;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      progressWrap.style.display = "none";
      clearInterval(progTimer);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fd = new FormData(form);
      startProgress();

      try{
        const url = token ? `/admin?token=${encodeURIComponent(token)}` : "/admin";
        const res = await fetch(url, {
          method: "POST",
          body: fd,
          headers: { "X-Requested-With": "fetch" }
        });

        if (!res.ok){
          const txt = await res.text();
          throw new Error(txt || ("Upload failed: " + res.status));
        }

        const data = await res.json();
        finishProgress(true);

        // Reload list from server (manifest)
        await loadTracks();

        // Reset file input + optional fields
        form.querySelector('input[type="file"]').value = "";
      } catch(err){
        showError(err.message || String(err));
      }
    });

    // Initial list load
    loadTracks();
  </script>
</body>
</html>
